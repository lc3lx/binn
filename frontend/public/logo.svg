<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Automotive Luxury Shield / Emblem -->
  <g id="emblem">
    <path d="M8 12C8 9.79086 9.79086 8 12 8H36C38.2091 8 40 9.79086 40 12V26C40 33.732 32.5 39.5 24 42C15.5 39.5 8 33.732 8 26V12Z" fill="url(#gold_grad)" fill-opacity="0.15" stroke="url(#gold_grad)" stroke-width="2"/>
    <!-- Sleek aerodynamic speed lines inside shield -->
    <path d="M15 17L24 13L33 17" stroke="url(#gold_grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 23L24 19L33 23" stroke="url(#gold_grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stylized "E" / Speed fin -->
    <path d="M20 28H28M24 23V35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography: ETG RIDE -->
  <g id="text">
    <text x="50" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="1.5" fill="url(#gold_grad)">ETG</text>
    <text x="105" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="2" fill="#FFFFFF">RIDE</text>
    <text x="51" y="39" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" letter-spacing="2.5" fill="#94A3B8">EXECUTIVE MOBILITY</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gold_grad" x1="8" y1="8" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
</svg>
